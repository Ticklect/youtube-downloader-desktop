[package]
name = "youtube-downloader-desktop"
version = "0.0.0-beta"
edition = "2021"
build = "build.rs"
description = "Native Windows YouTube downloader with a Rust and Slint interface"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rfd = "0.15"
flate2 = "1.1.10"
sha2 = "0.10.9"

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
